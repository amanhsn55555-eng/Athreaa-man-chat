<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الغرفة الصوتية المتطورة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #14121e;
            --border: rgba(255, 255, 255, 0.06);
            --border2: rgba(255, 255, 255, 0.1);
            --gold: #ffd700;
            --orange: #ff6b35;
            --pink: #ff2e63;
            --green: #2ecc71;
            --text: #fff;
            --text2: rgba(255, 255, 255, 0.65);
            --text3: rgba(255, 255, 255, 0.4);
            --grad: linear-gradient(135deg, #ff6b35, #ff2e63);
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 22px;
            --tr: all 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.04;
            animation: floatOrb 15s infinite;
        }

        .bg-orb:nth-child(1) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ff6b35, transparent);
            top: -100px;
            right: -100px;
        }

        .bg-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff2e63, transparent);
            bottom: -100px;
            left: -100px;
            animation-delay: 5s;
        }

        @keyframes floatOrb {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.15);
            }
            66% {
                transform: translate(-40px, 40px) scale(.9);
            }
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 6px;
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 15, .9);
            backdrop-filter: blur(30px);
            z-index: 50;
            border-bottom: 1px solid var(--border);
            border-radius: 0 0 20px 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 3px;
            border-radius: var(--r-sm);
            background: rgba(255, 255, 255, .03);
            border: 1.5px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            transition: var(--tr);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-height: 42px;
            position: relative;
            overflow: hidden;
        }

        .tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .04), transparent);
            animation: tabShine 3s infinite;
        }

        @keyframes tabShine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff6b35, #ffd700, #ff2e63, #ff6b35);
            background-size: 200% 100%;
            animation: tabGlow 2s linear infinite;
            opacity: 0;
            transition: opacity .3s;
        }

        @keyframes tabGlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        .tab-btn .tab-icon {
            font-size: 16px;
            z-index: 1;
        }

        .tab-btn:hover {
            color: var(--text);
            border-color: var(--border2);
            background: rgba(255, 255, 255, .06);
        }

        .tab-btn:hover::after {
            opacity: .6;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255, 107, 53, .2), rgba(255, 46, 99, .15));
            border-color: rgba(255, 107, 53, .5);
            color: var(--text);
            box-shadow: 0 4px 15px rgba(255, 107, 53, .2);
            transform: translateY(-2px);
        }

        .tab-btn.active::after {
            opacity: 1;
        }

        .s-btn,
        .c-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--r-sm);
            border: 1.5px solid var(--border2);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--tr);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .s-btn::before,
        .c-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .04), transparent);
            animation: tabShine 3s infinite;
        }

        .s-btn {
            background: rgba(255, 255, 255, .03);
        }

        .c-btn {
            background: var(--grad);
            border: none;
            padding: 0 12px;
            width: auto;
            gap: 4px;
            font-size: 9px;
            font-weight: 700;
        }

        .search-wrap {
            padding: 0 4px 10px;
            position: sticky;
            top: 56px;
            z-index: 49;
            background: rgba(10, 10, 15, .85);
            backdrop-filter: blur(20px);
        }

        .search-in {
            width: 100%;
            padding: 8px 14px;
            background: rgba(255, 255, 255, .03);
            border: 1.5px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text);
            font-size: 12px;
            outline: none;
            transition: var(--tr);
            opacity: 0;
            max-height: 0;
            overflow: hidden;
        }

        .search-in.show {
            opacity: 1;
            max-height: 42px;
            margin-top: 4px;
            border-color: rgba(255, 107, 53, .4);
            background: rgba(255, 255, 255, .06);
        }

        .my-room-s {
            margin-bottom: 14px;
            display: none;
        }

        .my-room-s.show {
            display: block;
        }

        .sec-h {
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .my-room-c {
            background: linear-gradient(135deg, rgba(255, 107, 53, .2), rgba(255, 46, 99, .15));
            border: 2px solid rgba(255, 107, 53, .5);
            border-radius: var(--r-lg);
            cursor: pointer;
            transition: var(--tr);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
        }

        .my-room-c:hover {
            border-color: var(--gold);
            box-shadow: 0 8px 30px rgba(255, 215, 0, .25);
            transform: translateY(-2px);
        }

        .my-room-c img {
            width: 70px;
            height: 70px;
            border-radius: var(--r-md);
            object-fit: cover;
            background: var(--grad);
            flex-shrink: 0;
            border: 3px solid var(--gold);
        }

        .my-room-c .frame-img {
            border: 4px solid;
            border-image: linear-gradient(135deg, var(--gold), var(--orange), var(--pink)) 1;
            border-radius: 50%;
        }

        /* صور الغرف مربعات أكبر */
        .rooms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .room-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, .04) 0%, rgba(255, 255, 255, .01) 100%);
            border: 1.5px solid rgba(255, 255, 255, .08);
            border-radius: var(--r-lg);
            overflow: hidden;
            cursor: pointer;
            transition: var(--tr);
            position: relative;
        }

        .room-card:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, .2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .4);
        }

        /* صورة الغرفة مربعة بحجم أكبر */
        .room-card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1a2e, #2d1b3d);
            display: block;
        }

        .room-card-body {
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, .3);
        }

        .room-card-name {
            font-weight: 700;
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .room-card-mem {
            font-size: 10px;
            color: var(--text3);
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, .05);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .5;
            }
        }

        .room-badge {
            font-size: 8px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
        }

        .badge-pub {
            background: rgba(46, 204, 113, .25);
            color: var(--green);
        }

        .badge-priv {
            background: rgba(255, 107, 53, .25);
            color: var(--orange);
        }

        /* أيقونات جانبية */
        .side-icons {
            position: fixed;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 250;
        }

        .side-icons.show {
            display: flex;
        }

        .side-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 18, 30, .9);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: var(--tr);
            box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
            position: relative;
        }

        .side-icon:hover {
            transform: scale(1.1);
            border-color: var(--gold);
        }

        .side-icon .badge-dot {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--pink);
            border: 2px solid var(--bg);
            display: none;
            font-size: 9px;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
        }

        .side-icon .badge-dot.show {
            display: flex;
        }

        .side-icon .badge-dot.fr {
            background: #2ecc71;
        }

        .side-icon .badge-dot.msg {
            background: #3498db;
        }

        /* نافذة المحادثة - ملء الشاشة بالكامل */
        .chat-wrap {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 300;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .chat-wrap.active {
            display: flex;
        }

        .room-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: rgba(15, 12, 22, .95);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border);
            z-index: 20;
            min-height: 44px;
            flex-shrink: 0;
        }

        .room-id-box {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border2);
            border-radius: var(--r-sm);
            padding: 4px 8px;
            flex: 0 1 auto;
            min-width: 0;
            cursor: pointer;
            max-width: 40%;
        }

        .room-id-avatar {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--grad);
            flex-shrink: 0;
            border: 2px solid var(--gold);
        }

        .room-id-avatar.frame-active {
            border: 3px solid;
            border-image: linear-gradient(135deg, var(--gold), var(--orange), var(--pink)) 1;
            border-radius: 50%;
        }

        .room-id-name {
            font-weight: 800;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .room-id-id {
            font-size: 8px;
            color: rgba(255, 107, 53, .7);
            direction: ltr;
            text-align: right;
        }

        .like-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text2);
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
            padding: 3px 6px;
            font-size: 11px;
        }

        .like-btn img {
            width: 20px;
            height: 20px;
        }

        .like-btn.liked img {
            filter: drop-shadow(0 0 8px rgba(255, 46, 99, .8));
            animation: softPulse 1.5s infinite;
        }

        @keyframes softPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .members-w {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2px 6px 2px 3px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .top-avs {
            display: flex;
            align-items: center;
        }

        .top-av {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea, #f093fb);
            border: 2px solid rgba(10, 10, 15, .9);
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: -8px;
            flex-shrink: 0;
        }

        .top-av:first-child {
            margin-left: 0;
        }

        .mem-count {
            font-size: 9px;
            color: var(--text3);
        }

        /* منطقة الغرفة الرئيسية - خلفية بحجم أكبر */
        .room-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-size: cover !important;
            background-position: center !important;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .room-main::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            z-index: 0;
        }

        .pinned-msg {
            background: linear-gradient(90deg, rgba(255, 215, 0, .2), rgba(255, 107, 53, .2));
            border-bottom: 1px solid rgba(255, 215, 0, .3);
            padding: 5px 12px;
            font-size: 11px;
            color: var(--gold);
            text-align: center;
            position: relative;
            z-index: 2;
            display: none;
        }

        .pinned-msg.show {
            display: block;
        }

        /* إشعار دخول/خروج العضو */
        .join-leave-toast {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            background: rgba(20, 18, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.35);
            border-radius: 24px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            white-space: nowrap;
            animation: joinLeaveIn 0.5s ease-out, joinLeaveOut 0.5s 4.5s ease-in forwards;
        }

        .join-leave-toast img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 215, 0, 0.6);
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #f093fb);
        }

        .join-leave-toast .jl-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        @keyframes joinLeaveIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        @keyframes joinLeaveOut {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.8);
            }
        }

        .gift-toast {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            background: linear-gradient(135deg, rgba(255, 107, 53, .95), rgba(255, 46, 99, .9));
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 6px 16px;
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 6px 25px rgba(255, 215, 0, .5);
            animation: giftPop .5s ease-out;
            pointer-events: none;
        }

        .gift-toast.show {
            display: flex;
        }

        @keyframes giftPop {
            0% {
                transform: translateX(-50%) scale(.5);
                opacity: 0;
            }
            60% {
                transform: translateX(-50%) scale(1.1);
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        .gift-full {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(0, 0, 0, .75);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: none;
            animation: giftFull 5s ease-in-out forwards;
        }

        .gift-full.show {
            display: flex;
        }

        @keyframes giftFull {
            0% {
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .gift-full-emoji {
            font-size: 90px;
            animation: giftBounce .6s ease-out;
        }

        @keyframes giftBounce {
            0% {
                transform: scale(0);
            }
            60% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        .gift-full-text {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold);
            text-align: center;
            margin-top: 8px;
            background: rgba(0, 0, 0, .6);
            padding: 10px 22px;
            border-radius: 25px;
        }

        .gift-full-detail {
            font-size: 13px;
            color: #fff;
            margin-top: 4px;
            background: rgba(255, 107, 53, .4);
            padding: 6px 16px;
            border-radius: 18px;
        }

        .mic-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px 6px;
            width: 100%;
            gap: 5px;
            position: relative;
            z-index: 2;
        }

        .mic-seat {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
        }

        .mic-seat .ring {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .mic-seat.occ .ring {
            background: linear-gradient(45deg, #ff6b35, #ff2e63, #ffd700, #667eea, #ff6b35) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: ringRot 3s linear infinite;
        }

        @keyframes ringRot {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .mic-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, .2);
            display: block;
        }

        .mic-name {
            font-size: 9px;
            color: rgba(255, 255, 255, .85);
            text-align: center;
            margin-top: 1px;
        }

        .prem-ticker {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, .6);
            border-top: 1px solid rgba(255, 215, 0, .3);
            border-bottom: 1px solid rgba(255, 215, 0, .3);
            padding: 5px 0;
            overflow: hidden;
            height: 44px;
            display: none;
            margin: 3px 8px;
            border-radius: 18px;
        }

        .prem-ticker.show {
            display: flex;
            align-items: center;
        }

        .prem-track {
            display: flex;
            gap: 14px;
            animation: ticker 25s linear infinite;
            white-space: nowrap;
            padding: 0 8px;
        }

        @keyframes ticker {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }

        async function applyShopItemsToRoom(room) { if (!currentUser) return; const invDoc = await getDoc(doc(db, 'inventories',

                    $('settingsSubModal').classList.remove('active'); });
                $('deleteRoom3Btn')?.addEventListener('click', async () => { if (!confirm('⚠️ حذف نهائي؟')) return; try { const ms =
                        await getDocs(collection(db, 'rooms', activeRoom.id, 'messages'));
                        ms.forEach(async d => await deleteDoc(d.ref)); } catch (e) {} await deleteDoc(doc(db, 'rooms',
                    activeRoom.id));
                    $('settingsSubModal').classList.remove('active');
                    showToast('🗑️', 'تم');
                    leaveRoom();
                    loadRooms(); });
                document.querySelectorAll('#settingsSubContent .shop-item').forEach(item => item.addEventListener('click',
                    function() { const t = this.dataset.type; if (t === 'bg') { document.querySelectorAll(
                            '#settingsSubContent .shop-item[data-type="bg"]').forEach(i => i.classList.remove(
                                'sel'));
                        this.classList.add('sel');
                        selectedShopBg = this.dataset.url; } else { document.querySelectorAll(
                            '#settingsSubContent .shop-item[data-type="img"]').forEach(i => i.classList.remove(
                                'sel'));
                        this.classList.add('sel');
                        selectedShopImg = this.dataset.url; } }));
                document.querySelectorAll('#settingsSubContent .mini-btn.remove').forEach(b => b.addEventListener('click',
                    async function() { await deleteDoc(doc(db, 'rooms', activeRoom.id, 'staff', this.dataset.uid));
                        delete roomStaff[this.dataset.uid];
                        $('settingsSubModal').classList.remove('active');
                        showToast('⬇️', 'تم'); }));
                document.querySelectorAll('#settingsSubContent .mini-btn.save').forEach(b => b.addEventListener('click',
                    async function() { const nb = { ...roomSettings.bannedUsers };
                        delete nb[this.dataset.uid];
                        await updateDoc(doc(db, 'rooms', activeRoom.id), { bannedUsers: nb });
                        roomSettings.bannedUsers = nb;
                        $('settingsSubModal').classList.remove('active');
                        showToast('✅', 'تم'); }));
            }, 100);
        }
        $('closeSettingsSub').addEventListener('click', () => $('settingsSubModal').classList.remove('active'));

        function renderMessage(msg, mid, isOwner) { const t = msg.createdAt?.toDate?.() || new Date(); const ts = t.toLocaleTimeString(
                'ar-SA', { hour: '2-digit', minute: '2-digit' }); const ac = (msg.senderName || '?').charAt(0); const isO =
                activeRoom && msg.senderId === activeRoom.createdBy; const sd = roomStaff[msg.senderId]; let sb = ''; if (isO) sb =
                '<span class="s-badge admin">👑</span>'; else if (sd) sb =
                `<span class="s-badge ${sd.role}">${sd.role==='admin'?'🛡️':'⭐'}</span>`; const row = document.createElement('div');
            row.className = 'msg-row';
            row.innerHTML =
                `${isOwner?`<button class="msg-del" data-msgid="${mid}" title="حذف"><i class="bi bi-x"></i></button>`:''}<div class="msg-av" data-uid="${msg.senderId}" data-name="${msg.senderName||''}" data-avatar="${msg.senderAvatar||''}">${msg.senderAvatar?`<img src="${msg.senderAvatar}" style="width:100%;height:100%;border-radius:50%;">`:ac}</div><div><div style="display:flex;align-items:center;gap:3px;"><span class="msg-sender ${isO?'owner':''}" style="color:${isO?'#ff2e63':'#fff'}">${msg.senderName||'مستخدم'}</span>${sb}${getBadge()}<span style="font-size:7px;color:rgba(255,255,255,.4);">${ts}</span></div><div class="msg-body">${escapeHtml(msg.text)}</div></div>`;
            $('messagesArea').appendChild(row);
            row.querySelector('.msg-av')?.addEventListener('click', (e) => { const el = e.target.closest('.msg-av'); if (el && el
                    .dataset.uid !== 'system') showProfile(el.dataset.uid, el.dataset.name, el.dataset.avatar); }); if (isOwner) { row
                .querySelector('.msg-del')?.addEventListener('click', async (e) => { e.stopPropagation(); if (mid && activeRoom) {
                        await deleteDoc(doc(db, 'rooms', activeRoom.id, 'messages', mid));
                        row.remove();
                        showToast('🗑️', 'تم حذف الرسالة'); } }); }
        }

        function escapeHtml(t) { const d = document.createElement('div');
            d.textContent = t; return d.innerHTML; }

        function scrollBottom() { requestAnimationFrame(() => { const msgs = $('messagesArea');
                msgs.scrollTop = msgs.scrollHeight; }); }

        function sendMessage() { if (chatLocked) { const isOwner = currentUser && activeRoom?.createdBy === currentUser.uid; const
                isStaff = currentUser && roomStaff[currentUser.uid]; if (!isOwner && !isStaff) return showToast('🔒',
                'الدردشة متوقفة'); } let t = $('chatInput').value.trim(); if (!t || !activeRoom || !currentUser) return; const msgData = {
                text: t,
                senderId: currentUser.uid,
                senderName: currentUser.displayName || 'مستخدم',
                senderAvatar: currentUser.photoURL || '',
                createdAt: new Date() };
            renderMessage(msgData, 'l' + Date.now(), false);
            scrollBottom();
            $('chatInput').value = '';
            $('chatInput').focus();
            addDoc(collection(db, 'rooms', activeRoom.id, 'messages'), { ...msgData, createdAt: serverTimestamp() }); }
        $('sendBtn').addEventListener('click', sendMessage);
        $('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                sendMessage(); } });
        document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', function(e) { if (e.target === this) this
                .classList.remove('active'); }));

        onAuthStateChanged(auth, (u) => { currentUser = u;
            loadShopData();
            loadRooms();
            loadFriendData();
            startGlobalGiftsListener(); if (u) { onSnapshot(collection(db, 'friends'), () => { loadFriendData(); });
                onSnapshot(query(collection(db, 'friendRequests'), where('to', '==', u.uid), where('status', '==', 'pending')),
                    () => { loadFriendData(); }); } });
        loadRooms();
        startGlobalGiftsListener();
    </script>
</body>
</html>
